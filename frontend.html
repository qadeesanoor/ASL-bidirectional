<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Language Recognition System</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    color: white;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(63, 94, 251, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(252, 70, 107, 0.1) 0%, transparent 50%);
    animation: gradientShift 15s ease infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes gradientShift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-50px, 50px) rotate(180deg); }
  }

  .center {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 5rem;
    font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
    letter-spacing: -2px;
    animation: titleGlow 3s ease-in-out infinite;
    text-shadow: 0 0 80px rgba(102, 126, 234, 0.5);
  }

  @keyframes titleGlow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(102, 126, 234, 0.4)); }
    50% { filter: brightness(1.2) drop-shadow(0 0 40px rgba(118, 75, 162, 0.6)); }
  }

  p.subtitle {
    color: #9ca3af;
    letter-spacing: 4px;
    margin-bottom: 3rem;
    font-size: 0.9rem;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInUp 1s ease forwards 0.3s;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    perspective: 1000px;
    margin-bottom: 40px;
  }

  .card {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 40px 30px;
    width: 280px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
  }

  .card:nth-child(1) { animation-delay: 0.4s; }
  .card:nth-child(2) { animation-delay: 0.6s; }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 0;
  }

  .card:hover::before { opacity: 1; }
  .card:hover {
    transform: translateY(-10px) scale(1.02);
    border: 1px solid rgba(102, 126, 234, 0.5);
    box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
  }

  .card-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
    animation: float 3s ease-in-out infinite;
  }

  .card:nth-child(1) .card-icon { animation-delay: 0s; }
  .card:nth-child(2) .card-icon { animation-delay: 1.5s; }

  @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

  .card h2 {
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 1.5rem;
    font-weight: 700;
    position: relative;
    z-index: 1;
  }

  .card p {
    margin: 0;
    font-size: 0.95rem;
    color: #9ca3af;
    position: relative;
    z-index: 1;
  }

  button {
    margin-top: 15px;
    padding: 14px 32px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
  }

  button:hover::before {
    width: 300px;
    height: 300px;
  }

  button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6); }
  button:active { transform: translateY(0); }

  textarea {
    width: 100%;
    max-width: 500px;
    height: 120px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    color: white;
    padding: 16px;
    resize: none;
    font-size: 1rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
  }

  textarea::placeholder { color: #6b7280; }

  input[type="file"] { display: none; }

  label.upload-label {
    display: block;
    width: 100%;
    max-width: 500px;
    padding: 40px;
    border: 3px dashed rgba(255,255,255,0.2);
    border-radius: 20px;
    cursor: pointer;
    margin-top: 20px;
    background: rgba(255,255,255,0.03);
    transition: all 0.3s;
    font-size: 1rem;
    color: #9ca3af;
  }

  label.upload-label:hover {
    border-color: #667eea;
    background: rgba(102,126,234,0.1);
    color: white;
  }

  .video-container {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .video-player {
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(102,126,234,0.3);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(102,126,234,0.3);
    position: relative;
    overflow: hidden;
  }

  #videoCanvas {
    border-radius: 12px;
    display: block;
    background: #000;
  }

  .result-text {
    margin-top: 20px;
    font-size: 2.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 20px;
    border-radius: 16px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 768px) {
    h1 { font-size: 3rem; }
    .card { width: 100%; max-width: 320px; }
    .result-text { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div id="home" class="center">
  <h1>Sign Language Translator</h1>
  <p class="subtitle"> Bridging silence with understanding </p>

  <div class="card-container">
    <div class="card" onclick="showTextToSign()">
      <div class="card-icon">✍️</div>
      <h2>Text → Sign</h2>
      <p>Convert text to ASL </p>
    </div>
    <div class="card" onclick="showSignToText()">
      <div class="card-icon">🤟</div>
      <h2>Sign → Text</h2>
      <p>Covert ASL to text </p>
    </div>
  </div>

  <!-- Text to Sign -->
  <div id="text-to-sign" style="display:none; width: 100%; margin-top: 40px;">
    <textarea id="inputText" placeholder="Type your message here..."></textarea><br>
    <button onclick="convertTextToSign()">Convert to ASL</button>
    <div class="video-container" id="videoContainer" style="display:none;">
      <div class="video-player">
        <canvas id="videoCanvas" width="640" height="480"></canvas>
      </div>
    </div>
  </div>

  <!-- Sign to Text -->
  <div id="sign-to-text" style="display:none; width: 100%; margin-top: 40px;">
    <label class="upload-label" for="videoUpload" id="fileLabel">
      📹 Click to upload images or video
    </label>
    <input type="file" id="videoUpload" accept="image/*,video/*" multiple>
    <button onclick="convertSignToText()">Convert to Text</button>
    <div id="textOutput" class="result-text"></div>
  </div>
</div>

<script>
const CROP_X = 150, CROP_Y = 50, CROP_WIDTH = 600, CROP_HEIGHT = 600;
const CANVAS_WIDTH = 640, CANVAS_HEIGHT = 480;

function showTextToSign() {
  document.getElementById('text-to-sign').style.display = 'block';
  document.getElementById('sign-to-text').style.display = 'none';
  document.getElementById('videoContainer').style.display = 'none';
}

function showSignToText() {
  document.getElementById('sign-to-text').style.display = 'block';
  document.getElementById('text-to-sign').style.display = 'none';
}

document.getElementById('videoUpload').addEventListener('change', function() {
  if(this.files.length > 0) {
    document.getElementById('fileLabel').innerHTML = '✅ ' + this.files.length + ' file(s) selected';
  }
});

async function convertTextToSign() {
  const text = document.getElementById('inputText').value.trim();
  if(!text) { alert('Please enter text'); return; }

  const videoContainer = document.getElementById('videoContainer');
  const canvas = document.getElementById('videoCanvas');
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
  videoContainer.style.display = 'flex';

  try {
    const response = await fetch('http://localhost:5000/api/text-to-sign', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    const data = await response.json();
    if(data.success && data.videos.length > 0) {
      await playVideosSequentially(data.videos, canvas, ctx);
    } else {
      alert(data.error || 'No videos found');
      videoContainer.style.display = 'none';
    }
  } catch(err) {
    console.error(err);
    alert('Backend connection error!');
    videoContainer.style.display = 'none';
  }
}

async function playVideosSequentially(videos, canvas, ctx) {
  const video = document.createElement('video');
  video.style.display = 'none';
  document.body.appendChild(video);

  for(let i=0;i<videos.length;i++){
    video.src = `http://localhost:5000${videos[i].video_url}`;
    await new Promise((resolve,reject)=>{
      video.onloadedmetadata = ()=>{video.play().catch(reject);}
      const renderFrame = ()=>{
        if(video.paused || video.ended){
          if(video.ended) resolve();
          return;
        }
        ctx.drawImage(video,CROP_X,CROP_Y,CROP_WIDTH,CROP_HEIGHT,0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
        requestAnimationFrame(renderFrame);
      }
      video.oncanplay = ()=>{renderFrame();}
      video.onerror = ()=>reject(new Error('Video load failed'));
      video.load();
    });
  }

  video.remove();
}

async function convertSignToText() {
  const fileInput = document.getElementById('videoUpload');
  const files = fileInput.files;
  if(files.length===0){ alert("Upload at least one file"); return; }

  const outputDiv = document.getElementById('textOutput');
  outputDiv.innerText = "⏳ Processing...";

  const formData = new FormData();
  for(let i=0;i<files.length;i++){ formData.append("video",files[i]); }

  try{
    const response = await fetch("http://localhost:5000/api/sign-to-text",{method:"POST",body:formData});
    const data = await response.json();
    if(data.success){
      outputDiv.innerText = data.text || "✅ Done";
    } else {
      outputDiv.innerText = "❌ " + data.error;
    }
  }catch(err){
    console.error(err);
    outputDiv.innerText = "Backend error!";
  }
}
</script>
</body>
</html>
